version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: siem_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://siem_user:siem_password@postgres:5432/siem_db
      - SECRET_KEY=09d25e094faa6ca2556c818166b7a9563b93f7099f6f0f4caa6cf63b88e8d3e7
      - CORS_ORIGINS=http://localhost,http://localhost:5173
    volumes:
      - ./logs:/app/logs
      - ./uploads:/app/uploads
      - ./reports:/app/reports
    depends_on:
      - postgres
    restart: always

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: siem_frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: always

  postgres:
    image: postgres:16-alpine
    container_name: siem_postgres
    environment:
      POSTGRES_USER: siem_user
      POSTGRES_PASSWORD: siem_password
      POSTGRES_DB: siem_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

volumes:
  postgres_data:
